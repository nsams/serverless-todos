# Deletes the Worker Preview of a branch and its D1 database (created by `npm run deploy:preview` in Workers Builds, see README)
# when its pull request is closed or the branch is deleted. Workers Builds has no hook for this.
#
# Requires the repository secrets CLOUDFLARE_API_TOKEN (permissions: Workers Scripts edit, D1 edit) and CLOUDFLARE_ACCOUNT_ID.
name: Delete Preview

on:
    pull_request:
        types: [closed]
    delete:

permissions:
    contents: read

jobs:
    delete-preview:
        # not for pull requests from forks (no secrets), only for deleted branches (not tags)
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'delete' && github.event.ref_type == 'branch')
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # the deleted branch doesn't exist anymore
                  ref: ${{ github.event.repository.default_branch }}
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Delete Preview and database
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                      echo "::warning::CLOUDFLARE_API_TOKEN is not set, Preview of $BRANCH not deleted"
                      exit 0
                  fi
                  npm run deploy:preview:delete -- "$BRANCH"
