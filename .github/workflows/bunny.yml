# Deployment to bunny.net Edge Scripting (see README "Deployment (bunny.net)"), on every push to main:
# builds the script (npm run build:bunny), applies the pending migrations to the Bunny Database, uploads the static files and the app
# module to the Storage Zone and deploys the script (a loader that imports the app module, see scripts/bunnyBuild.ts).
# Only runs when the repository variable BUNNY_STORAGE_ZONE is set.
name: Deploy to bunny.net

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: bunny-deploy
    cancel-in-progress: false

jobs:
    deploy:
        if: vars.BUNNY_STORAGE_ZONE != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - run: npm run build:bunny

            # before the new script is deployed: the running script must keep working with the new schema (see README "Database")
            - name: Apply migrations
              run: node scripts/migrate.ts
              env:
                  BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
                  BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_AUTH_TOKEN }}

            # file names with content hash: the files of the running script stay, the new script finds its files
            - name: Upload static files and app module
              run: |
                  cd dist/client
                  find assets server -type f | while read -r file; do
                      curl --fail --silent --show-error -X PUT "https://${STORAGE_HOST}/${STORAGE_ZONE}/${file}" \
                          -H "AccessKey: ${STORAGE_PASSWORD}" --data-binary "@${file}"
                  done
              env:
                  STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST || 'storage.bunnycdn.com' }}
                  STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
                  STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}

            - uses: BunnyWay/actions/deploy-script@main
              with:
                  script_id: ${{ secrets.BUNNY_SCRIPT_ID }}
                  deploy_key: ${{ secrets.BUNNY_DEPLOY_KEY }}
                  file: dist/bunny/script.js
