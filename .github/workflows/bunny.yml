# Deployment to bunny.net Magic Containers (see README "Deployment (bunny.net)"): on every push to main, builds the container image
# (Dockerfile), pushes it to the GitHub Container Registry and updates the app's container to it (rolling update).
# Only runs when the repository variable BUNNY_APP_ID is set; needs the secret BUNNY_API_KEY.
name: Deploy to bunny.net

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: bunny-deploy
    cancel-in-progress: false

jobs:
    deploy:
        if: vars.BUNNY_APP_ID != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - uses: BunnyWay/actions/container-update-image@main
              with:
                  app_id: ${{ vars.BUNNY_APP_ID }}
                  api_key: ${{ secrets.BUNNY_API_KEY }}
                  # the name of the container in the Magic Containers app
                  container: ${{ vars.BUNNY_CONTAINER_NAME || 'app' }}
                  image_tag: ${{ github.sha }}
