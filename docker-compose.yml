services:
    postgres:
        image: mirror.gcr.io/library/postgres:18
        pull_policy: weekly
        tty: true
        volumes:
            - postgres:/var/lib/postgresql
        ports:
            - "127.0.0.1:${POSTGRESQL_PORT}:5432"
        environment:
            POSTGRES_USER: ${POSTGRESQL_USER}
            POSTGRES_PASSWORD: ${POSTGRESQL_PWD}
            POSTGRES_DB: ${POSTGRESQL_DB}

volumes:
    postgres:
        driver: local
